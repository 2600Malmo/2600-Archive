remote_theme: pages-themes/hacker@v0.2.0
plugins:
- jekyll-remote-theme

exclude:
  - scripts

# All talk descriptions live in _talks/, one file per talk. Month pages
# and search/browse pages use this collection for every year.
collections:
  talks:
    output: true

defaults:
  - scope:
      path: "_talks"
    values:
      layout: talk

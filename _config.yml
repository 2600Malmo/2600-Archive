remote_theme: pages-themes/hacker@v0.2.0
plugins:
- jekyll-remote-theme
- jekyll-seo-tag
- jekyll-readme-index
- jekyll-github-metadata
- jekyll-feed
- jekyll-sitemap

kramdown:
  input: GFM

# Structured talk entries (one file per talk in _talks/). Each talk is
# rendered as its own page and also pulled into its month's archive page
# (see _layouts/month.html) and the site-wide search/browse pages.
collections:
  talks:
    output: true

defaults:
  - scope:
      path: "_talks"
    values:
      layout: talk
